<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Reef Notes</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#061a33">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Reef Notes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
:root{
  --ink:#eaf6ff; --muted:#9bb7d4; --line:rgba(120,190,255,.22);
  --panel:rgba(7,22,48,.74); --panel2:rgba(12,34,70,.82);
  --accent:#3dd9ff; --accent2:#ff4fd8; --warn:#ffb13d; --bad:#ff6b7d; --good:#4ade9c;
  --radius:16px;
}
*{box-sizing:border-box}
html{background:#041226}
body{background:transparent}
html,body{margin:0;min-height:100%;color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:16px;-webkit-text-size-adjust:100%}
.bg{position:fixed;inset:0;z-index:-2;background:#041226 url("background.jpg") center/cover no-repeat}
.bg::after{content:"";position:absolute;inset:0;
  background:linear-gradient(180deg,rgba(3,12,30,.15) 0%,rgba(3,12,30,.55) 45%,rgba(3,12,30,.82) 100%)}
header{position:sticky;top:0;z-index:20;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;
  background:linear-gradient(180deg,rgba(3,12,30,.92),rgba(3,12,30,.55));backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line)}
.bar{max-width:1100px;margin:0 auto;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:1.15rem;letter-spacing:.3px}
.brand img{width:38px;height:38px;border-radius:10px;box-shadow:0 0 14px rgba(61,217,255,.45)}
nav{display:flex;gap:6px;flex:1;flex-wrap:wrap}
nav button{background:transparent;border:1px solid transparent;color:var(--muted);padding:8px 14px;border-radius:999px;font-size:.95rem;cursor:pointer}
nav button.on{color:#021426;background:linear-gradient(135deg,var(--accent),#8be9ff);font-weight:600}
nav button:not(.on):hover{border-color:var(--line);color:var(--ink)}
.chip{font-size:.78rem;padding:5px 10px;border-radius:999px;border:1px solid var(--line);color:var(--muted);background:rgba(0,0,0,.25);white-space:nowrap}
.chip.ok{color:var(--good);border-color:rgba(74,222,156,.4)}
.chip.err{color:var(--bad);border-color:rgba(255,107,125,.5)}
.chip.busy{color:var(--accent)}
main{max-width:1100px;margin:0 auto;padding:18px 16px calc(96px + env(safe-area-inset-bottom))}
h1,h2,h3{margin:0}
h2{font-size:1.1rem;margin-bottom:12px;letter-spacing:.3px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:16px;
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);box-shadow:0 8px 30px rgba(0,0,0,.3)}
.hero{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin:6px 0 16px}
.hero h1{font-size:1.7rem;text-shadow:0 2px 18px rgba(0,0,0,.6)}
.hero p{margin:4px 0 0;color:var(--muted)}
.btn{background:linear-gradient(135deg,var(--accent),#7be6ff);color:#021426;border:0;border-radius:12px;padding:11px 18px;font-size:1rem;font-weight:700;cursor:pointer}
.btn.sec{background:rgba(255,255,255,.08);color:var(--ink);border:1px solid var(--line);font-weight:500}
.btn.danger{background:rgba(255,107,125,.15);color:var(--bad);border:1px solid rgba(255,107,125,.4);font-weight:600}
.btn.sm{padding:7px 12px;font-size:.88rem;border-radius:10px}
.btn:active{transform:translateY(1px)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}
.tile{position:relative;text-align:left;color:var(--ink);cursor:pointer;background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:14px 14px 12px;
  border-left:4px solid var(--c,var(--accent));transition:transform .12s,border-color .12s}
.tile:hover{transform:translateY(-2px);border-color:var(--c,var(--accent))}
.tile .ico{font-size:1.6rem;line-height:1}
.tile .nm{font-weight:650;margin:8px 0 4px}
.tile .last{font-size:.82rem;color:var(--muted);min-height:2.2em}
.badge{display:inline-block;margin-top:8px;font-size:.74rem;padding:3px 9px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.badge.ok{color:var(--good);border-color:rgba(74,222,156,.45)}
.badge.soon{color:var(--warn);border-color:rgba(255,177,61,.55)}
.badge.over{color:var(--bad);border-color:rgba(255,107,125,.6);background:rgba(255,107,125,.1)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:16px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.stat b{display:block;font-size:1.5rem;color:var(--accent)}
.stat span{font-size:.8rem;color:var(--muted)}
.evt{display:flex;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.evt:first-child{border-top:0}
.evt .dot{flex:0 0 38px;height:38px;border-radius:12px;display:grid;place-items:center;font-size:1.2rem;background:rgba(255,255,255,.07);border:1px solid var(--c,var(--line))}
.evt .body{flex:1;min-width:0}
.evt .t{font-weight:650}
.evt .m{font-size:.82rem;color:var(--muted);margin-top:2px}
.evt .d{margin-top:6px;white-space:pre-wrap;word-break:break-word;font-size:.94rem}
.evt .side{text-align:right;font-size:.85rem;color:var(--muted);white-space:nowrap}
.evt .cost{color:var(--warn);font-weight:650;display:block}
.thumbs{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.thumbs img{width:64px;height:64px;object-fit:cover;border-radius:8px;border:1px solid var(--line);cursor:pointer}
.acts{display:flex;gap:6px;margin-top:8px}
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
input,select,textarea{font:inherit;color:var(--ink);background:rgba(2,12,30,.7);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid rgba(61,217,255,.55);outline-offset:0}
select option{background:#06142c;color:var(--ink)}
textarea{min-height:90px;resize:vertical}
label{display:block;font-size:.8rem;color:var(--muted);margin:0 0 5px}
.field{margin-bottom:12px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pills{display:flex;gap:6px;flex-wrap:wrap}
.pill{border:1px solid var(--line);background:rgba(255,255,255,.05);color:var(--muted);padding:6px 12px;border-radius:999px;font-size:.85rem;cursor:pointer}
.pill.on{color:#021426;background:var(--accent);border-color:var(--accent);font-weight:650}
.fab{position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom));z-index:30;width:62px;height:62px;border-radius:50%;border:0;font-size:2rem;font-weight:300;
  color:#021426;background:linear-gradient(135deg,var(--accent),var(--accent2));box-shadow:0 8px 28px rgba(0,0,0,.5),0 0 22px rgba(61,217,255,.5);cursor:pointer}
.overlay{position:fixed;inset:0;z-index:50;background:rgba(2,8,20,.78);display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding:20px 12px}
.modal{width:100%;max-width:560px;background:#071a3a;border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:0 20px 60px rgba(0,0,0,.6);margin:auto}
.modal h2{margin-bottom:14px}
.modal .foot{display:flex;gap:10px;justify-content:flex-end;margin-top:6px}
.photos-edit{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.photos-edit .ph{position:relative}
.photos-edit img{width:72px;height:72px;object-fit:cover;border-radius:8px;border:1px solid var(--line)}
.photos-edit .x{position:absolute;top:-6px;right:-6px;width:22px;height:22px;border-radius:50%;border:0;background:var(--bad);color:#fff;cursor:pointer;line-height:1}
.empty{color:var(--muted);text-align:center;padding:26px 8px}
.bar-row{display:grid;grid-template-columns:150px 1fr 90px;gap:10px;align-items:center;margin:8px 0;font-size:.9rem}
.bar-track{height:12px;border-radius:999px;background:rgba(255,255,255,.08);overflow:hidden}
.bar-fill{height:100%;border-radius:999px;background:var(--c,var(--accent))}
.bar-row .v{text-align:right;color:var(--warn)}
.catrow{display:grid;grid-template-columns:54px 1fr 90px 46px auto;gap:8px;align-items:center;margin-bottom:8px}
.catrow input[type=color]{padding:2px;height:42px}
.note{font-size:.84rem;color:var(--muted);line-height:1.5}
code{background:rgba(255,255,255,.1);padding:2px 6px;border-radius:6px;font-size:.85em;word-break:break-all}
.lightbox{position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.92);display:grid;place-items:center;padding:16px}
.lightbox img{max-width:100%;max-height:100%;border-radius:10px}
@media (max-width:640px){
  .hero h1{font-size:1.4rem}
  .row2{grid-template-columns:1fr}
  .bar-row{grid-template-columns:110px 1fr 70px}
  .catrow{grid-template-columns:50px 1fr 70px 42px auto}
  .evt{flex-wrap:wrap}.evt .side{text-align:left;flex-basis:100%;padding-left:50px}
  .grid{grid-template-columns:repeat(2,1fr)}
}
</style>
</head>
<body>
<div class="bg"></div>
<header>
  <div class="bar">
    <div class="brand"><img src="icon-192.png" alt=""><span>Reef Notes</span></div>
    <nav id="nav"></nav>
    <span class="chip" id="syncChip">Local only</span>
  </div>
</header>
<main id="main"></main>
<button class="fab" id="fab" title="Add note" aria-label="Add note">+</button>
<div id="layer"></div>

<script>
"use strict";
/* ============================================================
   Reef Notes – event log for reef aquarium maintenance
   Data: localStorage + optional OneDrive file (Microsoft Graph)
   ============================================================ */
const LS_DATA = "reefNotes.data.v1";
const LS_SYNC = "reefNotes.sync.v1";
const LS_TAB  = "reefNotes.tab";

const DEFAULT_CATS = [
  {id:"dosing-tubes", name:"Dosing pump tubes", icon:"🧪", color:"#3dd9ff", interval:0},
  {id:"reefmat",      name:"Reefmat roll change", icon:"🧻", color:"#ffffff", interval:0},
  {id:"pump-clean",   name:"Pump cleaning", icon:"🌀", color:"#7b8cff", interval:0},
  {id:"skimmer",      name:"Skimmer clean-out", icon:"🫧", color:"#4ade9c", interval:0},
  {id:"new-pump",     name:"New pump", icon:"⚙️", color:"#ff4fd8", interval:0},
  {id:"equipment",    name:"Equipment purchase", icon:"🛒", color:"#ffb13d", interval:0},
  {id:"parts",        name:"Parts change-out", icon:"🔧", color:"#ff8a5c", interval:0},
  {id:"maintenance",  name:"Other maintenance", icon:"🛠️", color:"#b48cff", interval:0},
  {id:"note",         name:"General note", icon:"📝", color:"#9bb7d4", interval:0}
];

/* ---------- state ---------- */
function blank(){ return {events:[], deleted:{}, categories:DEFAULT_CATS.map(c=>({...c})), catUpdated:0}; }
function loadData(){
  try{ const d = JSON.parse(localStorage.getItem(LS_DATA)); if(d && Array.isArray(d.events)){
    d.deleted = d.deleted || {}; if(!Array.isArray(d.categories)||!d.categories.length) d.categories = DEFAULT_CATS.map(c=>({...c})); d.catUpdated=d.catUpdated||0; return d; } }catch(e){}
  return blank();
}
function loadSync(){
  const DEFAULT_CLIENT_ID = "05f5e283-efdd-4187-9b1d-cf5b686acfd7";
  const def = {clientId:DEFAULT_CLIENT_ID, tenant:"common", folder:"Browser Tools/Reef Notes", file:"reef-notes-data.json", token:null, lastSync:0};
  try{ const s=Object.assign(def, JSON.parse(localStorage.getItem(LS_SYNC))||{}); if(!s.clientId) s.clientId=DEFAULT_CLIENT_ID; return s; }catch(e){ return def; }
}
let data = loadData();
let sync = loadSync();
let ui = {tab: localStorage.getItem(LS_TAB)||"home", q:"", cat:"all", range:"all", status:"", statusKind:""};

function persistLocal(){ localStorage.setItem(LS_DATA, JSON.stringify(data)); }
function persistSync(){ localStorage.setItem(LS_SYNC, JSON.stringify(sync)); }
let pushTimer=null;
function save(){
  try{ persistLocal(); }
  catch(e){ alert("Browser storage is full – photos are probably too large. Export a backup and remove some photos."); }
  render();
  if(connected()){ clearTimeout(pushTimer); pushTimer=setTimeout(()=>syncNow(true),1200); }
}

/* ---------- helpers ---------- */
const $ = s=>document.querySelector(s);
const esc = s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid = ()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const money = n=>new Intl.NumberFormat("en-AU",{style:"currency",currency:"AUD"}).format(n||0);
const catOf = id=>data.categories.find(c=>c.id===id) || {id, name:"(removed category)", icon:"❔", color:"#9bb7d4", interval:0};
function pad(n){return String(n).padStart(2,"0");}
function nowLocal(){ const d=new Date(); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`; }
function dayStart(s){ const d=new Date(s); d.setHours(0,0,0,0); return d; }
function daysBetween(a,b){ return Math.round((dayStart(b)-dayStart(a))/86400000); }
function fmtDate(s){ if(!s) return ""; const d=new Date(s); return d.toLocaleDateString("en-AU",{day:"numeric",month:"short",year:"numeric"}); }
function fmtDT(s){ const d=new Date(s); return d.toLocaleDateString("en-AU",{weekday:"short",day:"numeric",month:"short",year:"numeric"})+" · "+d.toLocaleTimeString("en-AU",{hour:"numeric",minute:"2-digit"}); }
function ago(s){
  const n=daysBetween(s,new Date());
  if(n<=0) return "today"; if(n===1) return "yesterday";
  if(n<60) return n+" days ago";
  if(n<730) return Math.round(n/30.4)+" months ago";
  return (n/365).toFixed(1)+" years ago";
}
const sortedEvents = ()=>[...data.events].sort((a,b)=>b.date.localeCompare(a.date));
function lastOf(catId){ return sortedEvents().find(e=>e.category===catId); }
function dueInfo(cat){
  const last = lastOf(cat.id);
  let due = null;
  if(last && last.nextDue) due = last.nextDue;
  else if(last && cat.interval>0){ const d=new Date(last.date); d.setDate(d.getDate()+Number(cat.interval)); due = `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; }
  if(!due) return null;
  const n = daysBetween(new Date(), due);
  return {due, n, cls: n<0?"over":(n<=7?"soon":"ok"),
    text: n<0?`Overdue ${-n}d`:(n===0?"Due today":`Due in ${n}d`)};
}
function setStatus(text,kind){ ui.status=text; ui.statusKind=kind||""; paintChip(); }
function paintChip(){
  const c=$("#syncChip"); if(!c) return;
  c.className="chip "+(ui.statusKind||"");
  if(ui.status){ c.textContent=ui.status; return; }
  c.textContent = connected() ? (sync.lastSync?("OneDrive · synced "+new Date(sync.lastSync).toLocaleTimeString("en-AU",{hour:"numeric",minute:"2-digit"})):"OneDrive connected") : "Local only";
  if(connected()) c.className="chip ok";
}

/* ---------- rendering ---------- */
const TABS=[["home","Dashboard"],["log","Log"],["spend","Spend"],["settings","Settings"]];
function render(){
  $("#nav").innerHTML = TABS.map(([k,l])=>`<button data-tab="${k}" class="${ui.tab===k?"on":""}">${l}</button>`).join("");
  const m=$("#main");
  if(ui.tab==="home") m.innerHTML = viewHome();
  else if(ui.tab==="log") m.innerHTML = viewLog();
  else if(ui.tab==="spend") m.innerHTML = viewSpend();
  else m.innerHTML = viewSettings();
  paintChip();
}

function evtHTML(e, withActs){
  const c=catOf(e.category);
  const thumbs=(e.photos&&e.photos.length)?`<div class="thumbs">${e.photos.map((p,i)=>`<img src="${p}" data-photo="${esc(e.id)}:${i}" alt="photo">`).join("")}</div>`:"";
  return `<div class="evt" style="--c:${esc(c.color)}">
    <div class="dot">${esc(c.icon)}</div>
    <div class="body">
      <div class="t">${esc(e.title||c.name)}</div>
      <div class="m">${esc(c.name)}${e.item?" · "+esc(e.item):""}${e.supplier?" · "+esc(e.supplier):""}</div>
      ${e.details?`<div class="d">${esc(e.details)}</div>`:""}
      ${e.nextDue?`<div class="m">Next due: ${esc(fmtDate(e.nextDue))}</div>`:""}
      ${thumbs}
      ${withActs?`<div class="acts"><button class="btn sec sm" data-edit="${esc(e.id)}">Edit</button><button class="btn danger sm" data-del="${esc(e.id)}">Delete</button></div>`:""}
    </div>
    <div class="side">${esc(fmtDT(e.date))}<br>${esc(ago(e.date))}${e.cost>0?`<span class="cost">${money(e.cost)}</span>`:""}</div>
  </div>`;
}

function viewHome(){
  const evs=sortedEvents();
  const now=new Date();
  const thisMonth=evs.filter(e=>{const d=new Date(e.date);return d.getMonth()===now.getMonth()&&d.getFullYear()===now.getFullYear();}).length;
  const yearAgo=new Date(); yearAgo.setFullYear(yearAgo.getFullYear()-1);
  const spend12=evs.filter(e=>new Date(e.date)>=yearAgo).reduce((s,e)=>s+(Number(e.cost)||0),0);
  const dues=data.categories.map(c=>({c,d:dueInfo(c)})).filter(x=>x.d&&x.d.n<=7);
  const tiles=data.categories.map(c=>{
    const l=lastOf(c.id), d=dueInfo(c);
    return `<button class="tile" data-quick="${esc(c.id)}" style="--c:${esc(c.color)}">
      <div class="ico">${esc(c.icon)}</div>
      <div class="nm">${esc(c.name)}</div>
      <div class="last">${l?`Last: ${esc(fmtDate(l.date))}<br>${esc(ago(l.date))}`:"Not logged yet"}</div>
      ${d?`<span class="badge ${d.cls}">${esc(d.text)}</span>`:""}
    </button>`;}).join("");
  return `
  <div class="hero"><div><h1>Reef Notes</h1><p>Maintenance, parts and purchases – everything that happens to the tank.</p></div>
    <button class="btn" data-add="1">+ Add note</button></div>
  <div class="stats">
    <div class="stat"><b>${evs.length}</b><span>Notes logged</span></div>
    <div class="stat"><b>${thisMonth}</b><span>This month</span></div>
    <div class="stat"><b>${money(spend12)}</b><span>Spend, last 12 months</span></div>
    <div class="stat"><b style="color:${dues.some(x=>x.d.n<0)?"var(--bad)":dues.length?"var(--warn)":"var(--good)"}">${dues.length}</b><span>Due / overdue (7 days)</span></div>
  </div>
  <div class="panel"><h2>Quick add</h2><div class="grid">${tiles}</div></div>
  <div class="panel"><h2>Recent activity</h2>
    ${evs.length?evs.slice(0,8).map(e=>evtHTML(e,false)).join(""):`<div class="empty">No notes yet. Tap a tile above or the + button to log your first event.</div>`}
    ${evs.length>8?`<div style="text-align:center;margin-top:10px"><button class="btn sec sm" data-tab="log">View full log</button></div>`:""}
  </div>`;
}

function inRange(e){
  const d=new Date(e.date), n=new Date();
  switch(ui.range){
    case "30": return daysBetween(d,n)<=30;
    case "90": return daysBetween(d,n)<=90;
    case "year": return d.getFullYear()===n.getFullYear();
    case "12m": return daysBetween(d,n)<=365;
    default: return true;
  }
}
function filtered(){
  const q=ui.q.trim().toLowerCase();
  return sortedEvents().filter(e=>(ui.cat==="all"||e.category===ui.cat)&&inRange(e)&&(!q||[e.title,e.item,e.details,e.supplier,catOf(e.category).name].join(" ").toLowerCase().includes(q)));
}
function rangeOpts(){ return [["all","All time"],["30","Last 30 days"],["90","Last 90 days"],["12m","Last 12 months"],["year","This year"]].map(([v,l])=>`<option value="${v}" ${ui.range===v?"selected":""}>${l}</option>`).join(""); }

function viewLog(){
  const list=filtered();
  return `
  <div class="hero"><div><h1>Log</h1><p>${list.length} of ${data.events.length} notes</p></div><button class="btn" data-add="1">+ Add note</button></div>
  <div class="panel">
    <div class="filters">
      <div style="flex:2;min-width:180px"><input id="q" type="search" placeholder="Search notes, items, suppliers…" value="${esc(ui.q)}"></div>
      <div style="flex:1;min-width:150px"><select id="range">${rangeOpts()}</select></div>
      <button class="btn sec sm" data-export="csv">Export CSV</button>
    </div>
    <div class="pills" style="margin-bottom:12px">
      <button class="pill ${ui.cat==="all"?"on":""}" data-cat="all">All</button>
      ${data.categories.map(c=>`<button class="pill ${ui.cat===c.id?"on":""}" data-cat="${esc(c.id)}">${esc(c.icon)} ${esc(c.name)}</button>`).join("")}
    </div>
    ${list.length?list.map(e=>evtHTML(e,true)).join(""):`<div class="empty">Nothing matches these filters.</div>`}
  </div>`;
}

function viewSpend(){
  const list=filtered().filter(e=>Number(e.cost)>0);
  const total=list.reduce((s,e)=>s+Number(e.cost),0);
  const byCat={}, bySup={};
  list.forEach(e=>{byCat[e.category]=(byCat[e.category]||0)+Number(e.cost); const s=(e.supplier||"").trim()||"(no supplier)"; bySup[s]=(bySup[s]||0)+Number(e.cost);});
  const catRows=Object.entries(byCat).sort((a,b)=>b[1]-a[1]);
  const max=catRows.length?catRows[0][1]:1;
  const supRows=Object.entries(bySup).sort((a,b)=>b[1]-a[1]);
  return `
  <div class="hero"><div><h1>Spend</h1><p>Costs recorded on notes (purchases, parts, consumables).</p></div></div>
  <div class="panel">
    <div class="filters"><div style="min-width:180px"><select id="range">${rangeOpts()}</select></div></div>
    <div class="stats">
      <div class="stat"><b>${money(total)}</b><span>Total spend</span></div>
      <div class="stat"><b>${list.length}</b><span>Costed notes</span></div>
    </div>
    <h2>By category</h2>
    ${catRows.length?catRows.map(([id,v])=>{const c=catOf(id);return `<div class="bar-row"><div>${esc(c.icon)} ${esc(c.name)}</div><div class="bar-track"><div class="bar-fill" style="width:${(v/max*100).toFixed(1)}%;--c:${esc(c.color)}"></div></div><div class="v">${money(v)}</div></div>`;}).join(""):`<div class="empty">No costs recorded in this period.</div>`}
  </div>
  <div class="panel"><h2>By supplier</h2>
    ${supRows.length?supRows.map(([s,v])=>`<div class="bar-row" style="grid-template-columns:1fr 90px"><div>${esc(s)}</div><div class="v">${money(v)}</div></div>`).join(""):`<div class="empty">—</div>`}
  </div>
  <div class="panel"><h2>Purchases &amp; costed notes</h2>${list.length?list.map(e=>evtHTML(e,false)).join(""):`<div class="empty">—</div>`}</div>`;
}

function redirectUri(){ return location.origin+location.pathname; }
function viewSettings(){
  const used={}; data.events.forEach(e=>used[e.category]=(used[e.category]||0)+1);
  const bytes=new Blob([JSON.stringify(data)]).size;
  const cats=data.categories.map((c,i)=>`<div class="catrow">
      <input data-cat-f="icon" data-i="${i}" value="${esc(c.icon)}" maxlength="4" style="text-align:center;font-size:1.3rem">
      <input data-cat-f="name" data-i="${i}" value="${esc(c.name)}" placeholder="Category name">
      <input data-cat-f="interval" data-i="${i}" type="number" min="0" step="1" value="${c.interval||0}" title="Repeat every N days (0 = no reminder)">
      <input data-cat-f="color" data-i="${i}" type="color" value="${esc(c.color)}">
      <button class="btn danger sm" data-cat-del="${i}" ${used[c.id]?"disabled title=\"Has notes – can't delete\"":""}>✕</button>
    </div>`).join("");
  return `
  <div class="hero"><div><h1>Settings</h1></div></div>
  <div class="panel"><h2>Categories &amp; reminders</h2>
    <p class="note">Set <b>Every (days)</b> to get a due / overdue badge on the dashboard, calculated from the last note in that category. A note's own “Next due” date overrides it. Use 0 for no reminder.</p>
    <div class="catrow note" style="margin-bottom:4px"><span>Icon</span><span>Name</span><span>Every (days)</span><span>Colour</span><span></span></div>
    ${cats}
    <button class="btn sec sm" data-cat-add="1">+ Add category</button>
  </div>
  <div class="panel"><h2>OneDrive sync</h2>
    <p class="note">The data file is kept in OneDrive so the tool works from any device. Register an app in Azure (platform <b>Single-page application</b>) with this redirect URI, then paste its Application (client) ID here:</p>
    <p><code>${esc(redirectUri())}</code></p>
    <div class="row2">
      <div class="field"><label>Application (client) ID</label><input id="s_client" value="${esc(sync.clientId)}" placeholder="xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx"></div>
      <div class="field"><label>Tenant (common, consumers or tenant ID)</label><input id="s_tenant" value="${esc(sync.tenant)}"></div>
    </div>
    <div class="row2">
      <div class="field"><label>OneDrive folder</label><input id="s_folder" value="${esc(sync.folder)}"></div>
      <div class="field"><label>Data file name</label><input id="s_file" value="${esc(sync.file)}"></div>
    </div>
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      ${connected()?`<button class="btn" data-sync="now">Sync now</button><button class="btn sec" data-sync="save">Save settings</button><button class="btn danger" data-sync="off">Disconnect</button>`
                  :`<button class="btn" data-sync="on">Connect to OneDrive</button><button class="btn sec" data-sync="save">Save settings</button>`}
    </div>
    <p class="note" style="margin-top:10px">Folder is relative to the root of your OneDrive. Until connected, notes are saved in this browser only.</p>
  </div>
  <div class="panel"><h2>Backup</h2>
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      <button class="btn sec" data-export="json">Download backup (JSON)</button>
      <button class="btn sec" data-export="csv">Export CSV</button>
      <button class="btn sec" id="importBtn">Import backup…</button>
      <input type="file" id="importFile" accept="application/json,.json" hidden>
    </div>
    <p class="note" style="margin-top:10px">${data.events.length} notes · data size ${(bytes/1024).toFixed(0)} KB ${bytes>3500000?'<b style="color:var(--bad)">– close to the 4 MB OneDrive upload limit, reduce photos</b>':""}</p>
  </div>`;
}

/* ---------- add / edit modal ---------- */
let draftPhotos=[];
function openForm(opts){
  opts=opts||{};
  const e=opts.edit ? data.events.find(x=>x.id===opts.edit) : null;
  const catId = e?e.category:(opts.cat||data.categories[0].id);
  draftPhotos = e&&e.photos?[...e.photos]:[];
  const items=[...new Set(data.events.map(x=>x.item).filter(Boolean))];
  const sups=[...new Set(data.events.map(x=>x.supplier).filter(Boolean))];
  $("#layer").innerHTML=`<div class="overlay" id="ov"><form class="modal" id="form" autocomplete="off">
    <h2>${e?"Edit note":"Add note"}</h2>
    <div class="row2">
      <div class="field"><label>Date &amp; time</label><input type="datetime-local" name="date" required value="${esc(e?e.date:nowLocal())}"></div>
      <div class="field"><label>Category</label><select name="category">${data.categories.map(c=>`<option value="${esc(c.id)}" ${c.id===catId?"selected":""}>${esc(c.icon)} ${esc(c.name)}</option>`).join("")}</select></div>
    </div>
    <div class="field"><label>Title (optional – defaults to category)</label><input name="title" value="${esc(e?e.title:"")}" placeholder="e.g. Replaced all 4 dosing tubes"></div>
    <div class="field"><label>Equipment / item</label><input name="item" list="dl_items" value="${esc(e?e.item:"")}" placeholder="e.g. Doser pump 2, Skimmer, Return pump"><datalist id="dl_items">${items.map(i=>`<option value="${esc(i)}">`).join("")}</datalist></div>
    <div class="field"><label>Details</label><textarea name="details" placeholder="What was done, part numbers, observations…">${esc(e?e.details:"")}</textarea></div>
    <div class="row2">
      <div class="field"><label>Cost (AUD)</label><input name="cost" type="number" step="0.01" min="0" inputmode="decimal" value="${e&&e.cost?esc(e.cost):""}"></div>
      <div class="field"><label>Supplier / shop</label><input name="supplier" list="dl_sup" value="${esc(e?e.supplier:"")}"><datalist id="dl_sup">${sups.map(i=>`<option value="${esc(i)}">`).join("")}</datalist></div>
    </div>
    <div class="field"><label>Next due date (optional)</label><input name="nextDue" type="date" value="${esc(e?e.nextDue:"")}"></div>
    <div class="field"><label>Photos / receipts</label><input type="file" id="photoIn" accept="image/*" multiple><div class="photos-edit" id="phEdit"></div></div>
    <div class="foot"><button type="button" class="btn sec" id="cancelF">Cancel</button><button class="btn" type="submit">${e?"Save changes":"Save note"}</button></div>
  </form></div>`;
  paintPhotos();
  $("#cancelF").onclick=closeLayer;
  $("#ov").addEventListener("mousedown",ev=>{ if(ev.target.id==="ov") closeLayer(); });
  $("#photoIn").onchange=async ev=>{
    for(const f of ev.target.files){ try{ draftPhotos.push(await shrink(f)); }catch(_){} }
    ev.target.value=""; paintPhotos();
  };
  $("#form").onsubmit=ev=>{
    ev.preventDefault();
    const f=new FormData(ev.target);
    const rec={ id:e?e.id:uid(), date:f.get("date"), category:f.get("category"), title:f.get("title").trim(),
      item:f.get("item").trim(), details:f.get("details").trim(), cost:parseFloat(f.get("cost"))||0,
      supplier:f.get("supplier").trim(), nextDue:f.get("nextDue")||"", photos:draftPhotos, updatedAt:Date.now() };
    if(!rec.title) rec.title=catOf(rec.category).name;
    if(e){ data.events[data.events.findIndex(x=>x.id===e.id)]=rec; } else data.events.push(rec);
    delete data.deleted[rec.id];
    closeLayer(); save();
  };
}
function paintPhotos(){
  const el=$("#phEdit"); if(!el) return;
  el.innerHTML=draftPhotos.map((p,i)=>`<div class="ph"><img src="${p}" alt=""><button type="button" class="x" data-rmph="${i}">×</button></div>`).join("");
  el.querySelectorAll("[data-rmph]").forEach(b=>b.onclick=()=>{draftPhotos.splice(+b.dataset.rmph,1);paintPhotos();});
}
function shrink(file){
  return new Promise((res,rej)=>{
    const img=new Image(), url=URL.createObjectURL(file);
    img.onload=()=>{
      const max=1000, s=Math.min(1,max/Math.max(img.width,img.height));
      const c=document.createElement("canvas"); c.width=Math.round(img.width*s); c.height=Math.round(img.height*s);
      c.getContext("2d").drawImage(img,0,0,c.width,c.height);
      URL.revokeObjectURL(url); res(c.toDataURL("image/jpeg",0.72));
    };
    img.onerror=rej; img.src=url;
  });
}
function closeLayer(){ $("#layer").innerHTML=""; }
function confirmDelete(id){
  const e=data.events.find(x=>x.id===id); if(!e) return;
  if(!confirm(`Delete “${e.title||catOf(e.category).name}” from ${fmtDate(e.date)}?`)) return;
  data.events=data.events.filter(x=>x.id!==id); data.deleted[id]=Date.now(); save();
}
function showPhoto(ref){
  const [id,i]=ref.split(":"); const e=data.events.find(x=>x.id===id); if(!e) return;
  const lb=document.createElement("div"); lb.className="lightbox"; lb.innerHTML=`<img src="${e.photos[+i]}" alt="">`;
  lb.onclick=()=>lb.remove(); document.body.appendChild(lb);
}

/* ---------- export / import ---------- */
function download(name,text,type){
  const a=document.createElement("a"); a.href=URL.createObjectURL(new Blob([text],{type})); a.download=name;
  document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},500);
}
function exportCSV(){
  const rows=[["Date","Category","Title","Item","Details","Cost","Supplier","Next due"]];
  filtered().forEach(e=>rows.push([e.date.replace("T"," "),catOf(e.category).name,e.title,e.item,e.details,e.cost||"",e.supplier,e.nextDue]));
  const csv=rows.map(r=>r.map(v=>`"${String(v==null?"":v).replace(/"/g,'""')}"`).join(",")).join("\r\n");
  download("reef-notes-"+nowLocal().slice(0,10)+".csv","﻿"+csv,"text/csv");
}
function payload(){ return {app:"reef-notes",version:1,savedAt:new Date().toISOString(),events:data.events,deleted:data.deleted,categories:data.categories,catUpdated:data.catUpdated}; }
function exportJSON(){ download("reef-notes-backup-"+nowLocal().slice(0,10)+".json",JSON.stringify(payload(),null,1),"application/json"); }
function mergeData(a,b){
  const out={events:[],deleted:Object.assign({},a.deleted,b.deleted),categories:a.categories,catUpdated:a.catUpdated||0};
  const map=new Map();
  [...a.events,...(b.events||[])].forEach(e=>{const p=map.get(e.id); if(!p||(e.updatedAt||0)>(p.updatedAt||0)) map.set(e.id,e);});
  Object.entries(out.deleted).forEach(([id,ts])=>{const e=map.get(id); if(e&&(e.updatedAt||0)<=ts) map.delete(id);});
  out.events=[...map.values()];
  if((b.catUpdated||0)>(a.catUpdated||0) && Array.isArray(b.categories) && b.categories.length){ out.categories=b.categories; out.catUpdated=b.catUpdated; }
  return out;
}

/* ---------- OneDrive (Microsoft Graph, auth code + PKCE) ---------- */
const SCOPE="Files.ReadWrite offline_access";
const connected=()=>!!(sync.clientId && sync.token && sync.token.refresh);
const b64url=buf=>btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
async function startLogin(){
  if(!sync.clientId){ alert("Enter your Azure Application (client) ID first."); return; }
  const verifier=b64url(crypto.getRandomValues(new Uint8Array(48)));
  const challenge=b64url(await crypto.subtle.digest("SHA-256",new TextEncoder().encode(verifier)));
  const state=uid();
  sessionStorage.setItem("reefNotes.pkce",JSON.stringify({verifier,state}));
  const u=new URL(`https://login.microsoftonline.com/${encodeURIComponent(sync.tenant||"common")}/oauth2/v2.0/authorize`);
  u.search=new URLSearchParams({client_id:sync.clientId,response_type:"code",redirect_uri:redirectUri(),response_mode:"query",scope:SCOPE,
    code_challenge:challenge,code_challenge_method:"S256",state,prompt:"select_account"}).toString();
  location.href=u.toString();
}
async function tokenRequest(params){
  const r=await fetch(`https://login.microsoftonline.com/${encodeURIComponent(sync.tenant||"common")}/oauth2/v2.0/token`,
    {method:"POST",headers:{"Content-Type":"application/x-www-form-urlencoded"},body:new URLSearchParams({client_id:sync.clientId,scope:SCOPE,...params})});
  const j=await r.json();
  if(!r.ok) throw new Error(j.error_description||j.error||"Sign-in failed");
  sync.token={access:j.access_token,refresh:j.refresh_token||(sync.token&&sync.token.refresh),exp:Date.now()+(j.expires_in-60)*1000};
  persistSync(); return sync.token.access;
}
async function handleRedirect(){
  const p=new URLSearchParams(location.search);
  if(!p.has("code")&&!p.has("error")) return false;
  const saved=JSON.parse(sessionStorage.getItem("reefNotes.pkce")||"null");
  history.replaceState(null,"",location.pathname);
  if(p.has("error")){ setStatus("Sign-in cancelled","err"); return false; }
  if(!saved||saved.state!==p.get("state")){ setStatus("Sign-in state mismatch","err"); return false; }
  try{
    await tokenRequest({grant_type:"authorization_code",code:p.get("code"),redirect_uri:redirectUri(),code_verifier:saved.verifier});
    sessionStorage.removeItem("reefNotes.pkce"); return true;
  }catch(e){ setStatus(e.message,"err"); return false; }
}
async function accessToken(){
  if(sync.token && sync.token.access && sync.token.exp>Date.now()) return sync.token.access;
  if(sync.token && sync.token.refresh) return tokenRequest({grant_type:"refresh_token",refresh_token:sync.token.refresh});
  throw new Error("Not signed in");
}
function fileUrl(){
  const path=[...sync.folder.split("/").map(s=>s.trim()).filter(Boolean),sync.file].map(encodeURIComponent).join("/");
  return `https://graph.microsoft.com/v1.0/me/drive/root:/${path}:/content`;
}
let syncing=false;
async function syncNow(quiet){
  if(!connected()||syncing) return; syncing=true;
  if(!quiet) setStatus("Syncing…","busy"); else setStatus("Saving to OneDrive…","busy");
  try{
    const tok=await accessToken();
    const g=await fetch(fileUrl(),{headers:{Authorization:"Bearer "+tok}});
    if(g.ok){ const remote=await g.json(); if(remote&&Array.isArray(remote.events)){ data=mergeData(data,{deleted:remote.deleted||{},events:remote.events,categories:remote.categories,catUpdated:remote.catUpdated}); persistLocal(); } }
    else if(g.status!==404) throw new Error("OneDrive read failed ("+g.status+")");
    const body=JSON.stringify(payload());
    const p=await fetch(fileUrl(),{method:"PUT",headers:{Authorization:"Bearer "+tok,"Content-Type":"application/json"},body});
    if(!p.ok) throw new Error("OneDrive save failed ("+p.status+(p.status===413?" – file too large":"")+")");
    sync.lastSync=Date.now(); persistSync(); ui.status=""; ui.statusKind=""; render();
  }catch(e){
    setStatus(String(e.message||e).slice(0,60),"err");
    if(/refresh|invalid_grant|AADSTS/i.test(String(e.message))){ sync.token=null; persistSync(); }
  }finally{ syncing=false; }
}

/* ---------- events ---------- */
document.addEventListener("click",ev=>{
  const t=ev.target.closest("[data-tab],[data-add],[data-quick],[data-edit],[data-del],[data-cat],[data-photo],[data-export],[data-sync],[data-cat-del],[data-cat-add],#importBtn");
  if(!t) return;
  const d=t.dataset;
  if(d.tab){ ui.tab=d.tab; localStorage.setItem(LS_TAB,d.tab); render(); window.scrollTo(0,0); }
  else if(d.add) openForm();
  else if(d.quick) openForm({cat:d.quick});
  else if(d.edit) openForm({edit:d.edit});
  else if(d.del) confirmDelete(d.del);
  else if(d.cat!==undefined && t.classList.contains("pill")){ ui.cat=d.cat; render(); }
  else if(d.photo) showPhoto(d.photo);
  else if(d.export==="csv") exportCSV();
  else if(d.export==="json") exportJSON();
  else if(d.catAdd){ data.categories.push({id:"c-"+uid(),name:"New category",icon:"📌",color:"#3dd9ff",interval:0}); data.catUpdated=Date.now(); save(); }
  else if(d.catDel!==undefined){ const c=data.categories[+d.catDel]; if(c&&confirm(`Delete category “${c.name}”?`)){ data.categories.splice(+d.catDel,1); data.catUpdated=Date.now(); save(); } }
  else if(d.sync){ readSyncFields();
    if(d.sync==="on") startLogin();
    else if(d.sync==="now") syncNow();
    else if(d.sync==="save"){ persistSync(); alert("Settings saved."); }
    else if(d.sync==="off"){ if(confirm("Disconnect from OneDrive? Notes stay on this device and in the OneDrive file.")){ sync.token=null; persistSync(); ui.status=""; render(); } }
  }
  else if(t.id==="importBtn") $("#importFile").click();
});
document.addEventListener("input",ev=>{
  const t=ev.target;
  if(t.id==="q"){ ui.q=t.value; const pos=t.selectionStart; render(); const q=$("#q"); q.focus(); q.setSelectionRange(pos,pos); }
});
document.addEventListener("change",ev=>{
  const t=ev.target;
  if(t.id==="range"){ ui.range=t.value; render(); }
  else if(t.dataset && t.dataset.catF!==undefined){
    const c=data.categories[+t.dataset.i]; const f=t.dataset.catF;
    c[f]= f==="interval" ? Math.max(0,parseInt(t.value)||0) : t.value;
    data.catUpdated=Date.now(); persistLocal(); if(connected()){clearTimeout(pushTimer);pushTimer=setTimeout(()=>syncNow(true),1200);}
  }
  else if(t.id==="importFile"){
    const f=t.files[0]; if(!f) return;
    f.text().then(txt=>{
      try{ const j=JSON.parse(txt); if(!Array.isArray(j.events)) throw 0;
        data=mergeData(data,{deleted:j.deleted||{},events:j.events,categories:j.categories,catUpdated:j.catUpdated});
        save(); alert("Imported "+j.events.length+" notes (merged with existing).");
      }catch(_){ alert("That file isn't a Reef Notes backup."); }
    });
  }
  else if(t.id && t.id.startsWith("s_")) readSyncFields(true);
});
function readSyncFields(persist){
  const v=id=>{const e=$("#"+id); return e?e.value.trim():null;};
  if(v("s_client")!==null){ sync.clientId=v("s_client"); sync.tenant=v("s_tenant")||"common"; sync.folder=v("s_folder")||"Browser Tools/Reef Notes"; sync.file=v("s_file")||"reef-notes-data.json"; }
  if(persist) persistSync();
}
$("#fab").onclick=()=>openForm();
document.addEventListener("keydown",e=>{ if(e.key==="Escape") closeLayer(); });

/* ---------- start ---------- */
(async function init(){
  render();
  const justLoggedIn = await handleRedirect();
  if(justLoggedIn){ ui.tab="settings"; localStorage.setItem(LS_TAB,"settings"); }
  render();
  if(connected()) syncNow(true);
  document.addEventListener("visibilitychange",()=>{ if(!document.hidden && connected() && Date.now()-sync.lastSync>120000) syncNow(true); });
})();
</script>
